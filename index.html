<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#13161b" />
    <title>Роман Сулейманов — фотограф</title>
    <meta name="description" content="Роман Сулейманов — фотограф из Москвы. Портрет, документальная и коммерческая съёмка." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2313161b'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='14' fill='%23C9A86A' text-anchor='middle'%3EРС%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script>document.documentElement.classList.add('js');</script>
    <!-- render-blocking: nav, footer and data-driven content exist before first paint -->
    <script type="module" src="/src/js/main.js" blocking="render"></script>
  </head>
  <body data-page="home">
    <div id="smooth-wrapper">
      <div id="smooth-content">
        <main>
          <section class="hero">
            <h1 class="hero__title container t-display-xl" data-split="load">Роман <span class="serif">Сулейманов</span></h1>
            <div class="hero__grid" data-hero-grid>
              <figure class="hero__tile hero__tile--l1 media" data-tone="fog"><img src="https://picsum.photos/seed/suleymanov-g1/1200/1000?grayscale" alt="" width="1200" height="1000" /></figure>
              <figure class="hero__tile hero__tile--c1 media" data-tone="stone"><img src="https://picsum.photos/seed/suleymanov-g6/1600/500?grayscale" alt="" width="1600" height="500" /></figure>
              <figure class="hero__tile hero__tile--r1 media" data-tone="night"><img src="https://picsum.photos/seed/suleymanov-g2/1200/1000?grayscale" alt="" width="1200" height="1000" /></figure>
              <figure class="hero__tile hero__tile--feature media" data-tone="night" data-hero-feature><img src="https://picsum.photos/seed/suleymanov-hero/2400/1500?grayscale" alt="Портрет в мягком свете" width="2400" height="1500" fetchpriority="high" /></figure>
              <figure class="hero__tile hero__tile--l2 media" data-tone="olive"><img src="https://picsum.photos/seed/suleymanov-g4/1200/700?grayscale" alt="" width="1200" height="700" /></figure>
              <figure class="hero__tile hero__tile--r2 media" data-tone="stone"><img src="https://picsum.photos/seed/suleymanov-g3/1200/1000?grayscale" alt="" width="1200" height="1000" /></figure>
              <figure class="hero__tile hero__tile--l3 media" data-tone="sand"><img src="https://picsum.photos/seed/suleymanov-g5/1600/500?grayscale" alt="" width="1600" height="500" /></figure>
              <figure class="hero__tile hero__tile--c3 media" data-tone="mono"><img src="https://picsum.photos/seed/suleymanov-g7/1600/500?grayscale" alt="" width="1600" height="500" /></figure>
            </div>
            <div class="hero__meta label">
              <span>Фотограф, Москва</span>
              <span class="muted">Портрет · Документ · Коммерция</span>
              <span>Листайте ↓</span>
            </div>
          </section>

          <section class="section container grid">
            <p class="col-label label muted">Подход</p>
            <p class="col-content t-display-m statement-text" data-statement>
              Я снимаю людей такими, какие они есть. Без лишнего света, без лишних слов — только <em class="serif">честный кадр</em> и тишина вокруг него.
            </p>
          </section>

          <figure class="full media" data-tone="stone" data-parallax>
            <img src="https://picsum.photos/seed/suleymanov-full/2400/1400?grayscale" alt="Пейзаж" width="2400" height="1400" loading="lazy" />
          </figure>

          <section class="strip">
            <div class="strip__head container">
              <h2 class="t-display-l" data-split>Избранное</h2>
              <a class="link link--arrow label" href="work.html">Все работы</a>
            </div>
            <div class="strip__track"></div>
          </section>

          <section class="section container">
            <div class="section-head">
              <h2 class="t-display-l" data-split>Индекс</h2>
              <p class="label muted">2022 — 2025</p>
            </div>
            <ul class="index-list" data-index></ul>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
